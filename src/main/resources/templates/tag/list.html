<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>タグ管理</title>
</head>
<body>
  <h1>タグ管理</h1>

  <a href="/">← カレンダーに戻る</a>

  <table border="1">
    <tr>
      <th>色</th>
      <th>タグ名</th>
      <th>操作</th>
    </tr>
    <tr th:each="tag : ${tags}">
      <td>
        <span th:style="'display:inline-block; width:20px; height:20px; background-color:' + ${tag.color}"></span>
      </td>
      <td th:text="${tag.name} ?: '未設定'"></td>
      <td>
        <form th:action="@{/tag/update}" method="post">
          <input type="hidden" name="id" th:value="${tag.id}">
          <input type="text" name="name" th:value="${tag.name}" placeholder="タグ名を入力">
          <button type="submit">保存</button>
        </form>
      </td>
    </tr>
  </table>
</body>
</html>
